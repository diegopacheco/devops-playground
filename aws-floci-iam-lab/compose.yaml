services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    environment:
      FLOCI_STORAGE_MODE: hybrid
    volumes:
      - floci-data:/app/data
  playground:
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "8080:8080"
    environment:
      FLOCI_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AI_BRIDGE_URL: http://host.containers.internal:18787
      AI_TOKEN_FILE: /run/iam-forge/ai-token
    volumes:
      - ./data/ai-token:/run/iam-forge/ai-token:ro
    depends_on:
      - floci
volumes:
  floci-data:
