<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660">
  <defs>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
      text { font-family: 'Caveat', 'Comic Sans MS', cursive; }
      .title { font-size: 42px; fill: #2b2b2b; font-weight: 700; }
      .t  { font-size: 27px; fill: #34343a; font-weight: 700; }
      .s  { font-size: 19px; fill: #5a5a64; }
      .tag{ font-size: 18px; fill: #6b6b75; font-weight: 700; }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="660" fill="#fffdf7"/>
  <text x="490" y="58" text-anchor="middle" class="title">Apple container + Redis 8 POC</text>

  <g filter="url(#wobble)">
    <rect x="40" y="95" width="900" height="245" rx="20" fill="#eef4ff" stroke="#9bb4e0" stroke-width="2.5"/>
    <rect x="40" y="370" width="900" height="250" rx="20" fill="#f3fff0" stroke="#9bd8a0" stroke-width="2.5"/>
  </g>
  <text x="62" y="125" class="tag">macOS host (Apple silicon)</text>
  <text x="62" y="400" class="tag">container machine  ·  lightweight Linux VM  ·  vmnet default 192.168.64.0/24</text>

  <g filter="url(#wobble)">
    <rect x="70" y="150" width="230" height="120" rx="16" fill="#dbe7ff" stroke="#5d80c4" stroke-width="2.5"/>
    <rect x="375" y="150" width="250" height="120" rx="16" fill="#ffe9c7" stroke="#d6a44e" stroke-width="2.5"/>
    <rect x="700" y="150" width="210" height="120" rx="16" fill="#ffd9e0" stroke="#d06a86" stroke-width="2.5"/>

    <rect x="375" y="430" width="250" height="130" rx="16" fill="#cdeccd" stroke="#4e9e57" stroke-width="2.5"/>
    <rect x="700" y="445" width="210" height="100" rx="16" fill="#e7dcff" stroke="#8a6fc4" stroke-width="2.5"/>
  </g>

  <text x="185" y="200" text-anchor="middle" class="t">start.sh</text>
  <text x="185" y="232" text-anchor="middle" class="s">brew install</text>
  <text x="185" y="256" text-anchor="middle" class="s">container</text>

  <text x="500" y="195" text-anchor="middle" class="t">container system start</text>
  <text x="500" y="227" text-anchor="middle" class="s">boots the container</text>
  <text x="500" y="251" text-anchor="middle" class="s">machine host service</text>

  <text x="805" y="200" text-anchor="middle" class="t">test.sh</text>
  <text x="805" y="232" text-anchor="middle" class="s">redis-cli PING</text>
  <text x="805" y="256" text-anchor="middle" class="s">SET / GET / INCR</text>

  <text x="500" y="478" text-anchor="middle" class="t">container run redis:8</text>
  <text x="500" y="510" text-anchor="middle" class="s">Redis 8 in its own</text>
  <text x="500" y="534" text-anchor="middle" class="s">micro-VM, port 6379</text>

  <text x="805" y="488" text-anchor="middle" class="t">--publish</text>
  <text x="805" y="518" text-anchor="middle" class="s">127.0.0.1:16379 to 6379</text>

  <g filter="url(#wobble)" fill="none" stroke="#7a7a82" stroke-width="2.6">
    <path d="M300 210 L370 210" marker-end="url(#arrow)"/>
    <path d="M500 270 L500 425" marker-end="url(#arrow)"/>
    <path d="M625 495 L695 495" marker-end="url(#arrow)"/>
    <path d="M805 445 L805 272" marker-end="url(#arrow)"/>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a7a82"/>
    </marker>
  </defs>

  <text x="640" y="408" class="s">forwards loopback to the container</text>
</svg>
